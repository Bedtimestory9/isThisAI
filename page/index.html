<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Is this AI?</title>
    <link href="/static/style.css" type="text/css" rel="stylesheet">
</head>

<body>
    <div class="quest-div">
        <div class="quest-content">
            <div class="is-this-ai">
                <b>Is this AI?</b>
            </div>
            <div class="img-div">
                <img id="guess-img" src="/asset/{{ .ID }}.jpeg" alt="image to guess">
            </div>
                <div id="toast-div">
                </div>
            <div class="answer-div">
                <button class="answer-button" id="yes-button" type="button">Yes</button>
                <button class="answer-button" id="no-button" type="button">No</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js">
    </script>
</body>

</html>
