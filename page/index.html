<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is this AI?</title>
    <link href="/static/style.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="overlay"></div>
    <div class="quest-div">
      <div class="quest-content">
        <div class="is-this-ai">
          <b>Is this AI? </b>
          {{ if le .Data.ID .ContainerSize }}
          <b class="progress">{{ .Data.ID }} / {{ .ContainerSize }}</b>
          {{ end }}
        </div>
        {{ if le .Data.ID .ContainerSize }}
        <img
          id="guess-img"
          class="guess-img-zoomout"
          src="/asset/{{ .Data.ID }}.jpeg"
          alt="image to guess"
        />
        {{ else }}
        <img
          id="guess-img"
          class="guess-img-zoomout"
          src="/asset/woohoo.gif"
          alt="woohoo"
        />
        {{ end }}
        <div class="answer-div">
          <div class="button-div">
            <button class="answer-button" id="yes-button" type="button">
              Yes
            </button>
            <button class="answer-button" id="no-button" type="button">
              No
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
